<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
  <title>Haqdar — Welfare Scheme Eligibility Checker</title>

  <!-- Typography: Fraunces & Figtree only via single link with display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <!-- Masthead -->
  <header class="masthead">
    <div class="container masthead-inner">
      <a href="#landing" class="wordmark" id="brand-wordmark">Haqdar</a>
      <button type="button" class="start-over-btn" id="btn-start-over" hidden>Start over</button>
    </div>
  </header>

  <!-- Main Application Container -->
  <main id="app-main" class="container">
    <!-- Progress Indicator (Form Screens Only) -->
    <div class="progress-container" id="progress-container" hidden>
      <div class="progress-header">
        <span class="progress-step-text" id="progress-step-text" aria-live="polite">Step 1 of 4</span>
        <span class="progress-step-title" id="progress-step-title">About you</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Application progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" id="progress-bar-role">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Active Screen Region -->
    <div id="screen-container"></div>
  </main>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
